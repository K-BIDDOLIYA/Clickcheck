<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reaction Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030303;color:#f7f2f2;font-family:Arial,sans-serif;text-align:center}main{width:min(90%,500px)}h1{font-size:42px;margin:0 0 10px}#message{color:#c8c1c1;margin:0 0 35px}#circle{width:220px;height:220px;margin:0 auto 35px;border-radius:50%;background:rgb(208,49,49)}button{padding:13px 32px;border:0;border-radius:10px;background:#fff;color:#111;font-size:18px;font-weight:bold;cursor:pointer}#time{margin-top:25px;font-size:36px;font-weight:bold}</style></head><body><main><h1>Reaction Test</h1><p id="message">Click Start and wait for the circle to turn green.</p><div id="circle"></div><button id="btn">Start</button><div id="time">0 ms</div></main><script>let e,t,n=0;btn.onclick=()=>{if(0===n)n=1,btn.textContent="Click Me!",message.textContent="Wait for green...",time.textContent="0 ms",circle.style.background="#e33",t=setTimeout(()=>{circle.style.background="#20d060",message.textContent="CLICK!",e=performance.now(),n=2},1e3+4e3*Math.random());else if(2===n){let t=Math.round(performance.now()-e);time.textContent=t+" ms",message.textContent=t<200?"Incredible!":t<300?"Great reaction!":"Good job!",circle.style.background="#e33",btn.textContent="Start",n=0}};</script></body></html>
